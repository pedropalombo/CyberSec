version: '3'
services:
  app:
    build:
      context: .       # Uses the Dockerfile in the current directory to build our "app/Dockerfile"
    ports:
      - "80:80"     

  nginx:
    image: nginx:stable      
    ports:
      - "8080:80"      
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app            
      